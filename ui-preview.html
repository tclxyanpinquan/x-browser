<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>x-browser — Visual Chromium Workspace</title>
  <style>
    :root {
      --bg: #f0f4f8;
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e8eef5 50%, #f5f7fa 100%);
      --panel: rgba(255, 255, 255, 0.92);
      --panel-solid: #ffffff;
      --panel-2: #f8fafc;
      --border: #d0dae6;
      --border-light: #e2e8f0;
      --text: #0f172a;
      --text-secondary: #1e293b;
      --muted: #64748b;
      --soft: #94a3b8;
      --primary: #2563eb;
      --primary-bright: #3b82f6;
      --primary-glow: rgba(37, 99, 235, 0.15);
      --primary-weak: #dbeafe;
      --success: #16a34a;
      --success-bright: #22c55e;
      --success-glow: rgba(22, 163, 74, 0.15);
      --success-weak: #dcfce7;
      --warning: #d97706;
      --warning-bright: #f59e0b;
      --warning-weak: #fef3c7;
      --danger: #dc2626;
      --danger-bright: #ef4444;
      --danger-weak: #fee2e2;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 16px 48px rgba(15, 23, 42, 0.1);
      --shadow-glow: 0 0 0 3px var(--primary-glow);
      --radius: 14px;
      --radius-sm: 10px;
      --radius-xs: 8px;
      --sidebar: rgba(240, 244, 250, 0.95);
      --sidebar-active: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
      --chip: #eef4ff;
      --glass: rgba(255, 255, 255, 0.7);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      overflow: hidden;
    }

    button, input, select, textarea {
      font: inherit;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 var(--primary-glow); }
      50% { box-shadow: 0 0 0 4px var(--primary-glow); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 0;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      background: linear-gradient(180deg, rgba(240, 244, 250, 0.98) 0%, rgba(235, 240, 248, 0.98) 100%);
      border-right: 1px solid var(--border-light);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 0;
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }
    .sidebar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 200px;
      background: linear-gradient(180deg, rgba(59, 130, 246, 0.04) 0%, transparent 100%);
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px 16px;
      position: relative;
      z-index: 1;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 50%, #1e40af 100%);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      box-shadow:
        0 8px 24px rgba(37, 99, 235, 0.3),
        0 2px 4px rgba(37, 99, 235, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      flex: 0 0 auto;
      position: relative;
      overflow: hidden;
    }
    .brand-mark::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      animation: shimmer 3s infinite;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text) 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      z-index: 1;
    }

    .nav button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      padding: 12px 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      cursor: pointer;
      text-align: left;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      font-weight: 600;
      font-size: 13px;
    }
    .nav button::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 0;
      background: linear-gradient(180deg, var(--primary-bright), var(--primary));
      border-radius: 0 3px 3px 0;
      transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav button:hover {
      background: rgba(255, 255, 255, 0.7);
      transform: translateX(2px);
      box-shadow: var(--shadow-sm);
    }
    .nav button:hover::before {
      height: 40%;
    }

    .nav button.active {
      background: var(--sidebar-active);
      box-shadow:
        inset 0 0 0 1px rgba(37, 99, 235, 0.15),
        0 4px 12px rgba(37, 99, 235, 0.08);
      color: var(--primary);
    }
    .nav button.active::before {
      height: 60%;
    }

    .nav-ico {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      flex: 0 0 auto;
      font-size: 16px;
      filter: drop-shadow(0 1px 2px rgba(37, 99, 235, 0.15));
    }

    .nav-label {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
    }

    .nav-count {
      font-size: 11px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .nav button:hover .nav-count,
    .nav button.active .nav-count {
      background: white;
      border-color: rgba(37, 99, 235, 0.2);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.1);
    }

    .sidebar-foot {
      margin-top: auto;
      padding: 16px;
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(248, 250, 252, 0.9) 100%);
      box-shadow: var(--shadow-sm);
      position: relative;
      z-index: 1;
      animation: fadeIn 0.5s ease 0.2s both;
    }

    .sidebar-foot .line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      font-weight: 500;
    }

    /* ===== MAIN ===== */
    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: 60px minmax(0, 1fr);
    }

    .topbar {
      height: 60px;
      border-bottom: 1px solid var(--border-light);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.88) 100%);
      backdrop-filter: blur(20px) saturate(180%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      gap: 16px;
      min-width: 0;
      position: relative;
      z-index: 10;
    }

    .title-block {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .page-title {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text) 0%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-desc {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 420px;
      font-weight: 500;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .search {
      width: min(380px, 34vw);
      height: 38px;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 0 16px;
      outline: none;
      background: white;
      color: var(--text);
      font-size: 13px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }
    .search::placeholder {
      color: var(--soft);
    }
    .search:focus {
      border-color: rgba(37, 99, 235, 0.4);
      box-shadow: var(--shadow-glow), var(--shadow-sm);
    }

    /* ===== BUTTONS ===== */
    .icon-btn, .primary-btn, .ghost-btn, .danger-btn {
      height: 38px;
      border-radius: 12px;
      border: 1px solid transparent;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .icon-btn::after, .primary-btn::after, .ghost-btn::after, .danger-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }
    .icon-btn:hover::after, .primary-btn:hover::after, .ghost-btn:hover::after, .danger-btn:hover::after {
      left: 100%;
    }

    .icon-btn:hover, .primary-btn:hover, .ghost-btn:hover, .danger-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .icon-btn:active, .primary-btn:active, .ghost-btn:active, .danger-btn:active {
      transform: translateY(0);
    }

    .icon-btn {
      background: white;
      border-color: var(--border-light);
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
    }
    .icon-btn:hover {
      border-color: var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }

    .primary-btn {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #1d4ed8 100%);
      color: white;
      box-shadow:
        0 6px 20px rgba(37, 99, 235, 0.25),
        0 2px 4px rgba(37, 99, 235, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      border: none;
    }
    .primary-btn:hover {
      box-shadow:
        0 8px 28px rgba(37, 99, 235, 0.35),
        0 2px 4px rgba(37, 99, 235, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      filter: brightness(1.05);
    }

    .ghost-btn {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border-color: var(--border-light);
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
    }
    .ghost-btn:hover {
      border-color: var(--border);
      background: white;
      box-shadow: var(--shadow);
    }

    .danger-btn {
      background: linear-gradient(180deg, #ffffff 0%, #fef2f2 100%);
      border-color: rgba(220, 38, 38, 0.2);
      color: var(--danger);
      box-shadow: var(--shadow-sm);
    }
    .danger-btn:hover {
      background: linear-gradient(180deg, #fef2f2 0%, #fee2e2 100%);
      border-color: rgba(220, 38, 38, 0.3);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.1);
    }

    /* ===== CONTENT ===== */
    .content {
      min-width: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 20px;
      padding: 20px;
    }

    .workspace {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.4s ease;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      overflow: hidden;
      background: white;
      box-shadow: var(--shadow-sm);
      padding: 3px;
    }

    .seg button {
      border: 0;
      background: transparent;
      height: 32px;
      padding: 0 16px;
      color: var(--muted);
      cursor: pointer;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .seg button:hover {
      color: var(--text-secondary);
      background: rgba(148, 163, 184, 0.08);
    }
    .seg button.active {
      background: linear-gradient(135deg, var(--chip) 0%, #dbeafe 100%);
      color: var(--primary);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.1);
    }

    /* ===== PANELS ===== */
    .table-panel, .detail-panel, .browser-frame, .settings-panel, .stats-panel {
      background: var(--panel);
      border: 1px solid rgba(208, 218, 230, 0.6);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-width: 0;
      backdrop-filter: blur(10px);
      transition: box-shadow 0.3s ease;
    }
    .table-panel:hover, .detail-panel:hover, .browser-frame:hover, .settings-panel:hover {
      box-shadow: var(--shadow-lg);
    }

    .table-panel {
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(251, 252, 254, 0.95) 100%);
    }

    .panel-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .panel-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      font-weight: 500;
    }

    .panel-body {
      padding: 0;
      min-width: 0;
    }

    /* ===== STATS ===== */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      background: linear-gradient(180deg, rgba(251, 253, 255, 0.9) 0%, rgba(255, 255, 255, 0.9) 100%);
    }

    .stat {
      border: 1px solid var(--border-light);
      border-radius: 14px;
      background: linear-gradient(135deg, var(--panel-2) 0%, #ffffff 100%);
      padding: 16px;
      min-width: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .stat::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary-bright), var(--primary));
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .stat:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-color: var(--border);
    }
    .stat:hover::before {
      opacity: 1;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 800;
      margin-top: 8px;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text) 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-foot {
      font-size: 11px;
      color: var(--soft);
      margin-top: 4px;
      font-weight: 500;
    }

    /* ===== TABLE ===== */
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      font-size: 11px;
      text-align: left;
      color: var(--muted);
      font-weight: 700;
      padding: 14px 20px;
      background: linear-gradient(180deg, #f8fbff 0%, #f0f7ff 100%);
      border-bottom: 1px solid var(--border-light);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tbody td {
      padding: 14px 20px;
      font-size: 13px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.6);
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    tbody tr {
      cursor: pointer;
      transition: all 0.15s ease;
    }
    tbody tr:hover {
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.04) 0%, rgba(59, 130, 246, 0.02) 100%);
    }
    tbody tr.selected {
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.08) 0%, rgba(59, 130, 246, 0.04) 100%);
      position: relative;
    }
    tbody tr.selected::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--primary-bright), var(--primary));
      border-radius: 0 3px 3px 0;
    }

    .cell-muted { color: var(--muted); }

    /* ===== PILLS ===== */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.9;
      box-shadow: 0 0 6px currentColor;
    }

    .pill.blue {
      color: #1d4ed8;
      background: linear-gradient(135deg, var(--primary-weak) 0%, #dbeafe 100%);
      border-color: rgba(37, 99, 235, 0.15);
      box-shadow: 0 1px 4px rgba(37, 99, 235, 0.08);
    }
    .pill.green {
      color: var(--success);
      background: linear-gradient(135deg, var(--success-weak) 0%, #dcfce7 100%);
      border-color: rgba(22, 163, 74, 0.15);
      box-shadow: 0 1px 4px rgba(22, 163, 74, 0.08);
    }
    .pill.amber {
      color: var(--warning);
      background: linear-gradient(135deg, var(--warning-weak) 0%, #fef3c7 100%);
      border-color: rgba(217, 119, 6, 0.15);
      box-shadow: 0 1px 4px rgba(217, 119, 6, 0.08);
    }
    .pill.red {
      color: var(--danger);
      background: linear-gradient(135deg, var(--danger-weak) 0%, #fee2e2 100%);
      border-color: rgba(220, 38, 38, 0.15);
      box-shadow: 0 1px 4px rgba(220, 38, 38, 0.08);
    }
    .pill.gray {
      color: var(--muted);
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      border-color: rgba(100, 116, 139, 0.12);
    }

    .table-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .mini-btn {
      border: 1px solid var(--border-light);
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      color: var(--text-secondary);
      height: 30px;
      padding: 0 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }
    .mini-btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow);
      border-color: var(--border);
    }
    .mini-btn.primary {
      border-color: rgba(37, 99, 235, 0.2);
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      color: #1d4ed8;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.12);
    }
    .mini-btn.primary:hover {
      background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    .mini-btn.danger {
      border-color: rgba(220, 38, 38, 0.2);
      background: linear-gradient(180deg, #fff5f5 0%, #fef2f2 100%);
      color: var(--danger);
    }

    /* ===== DETAIL PANEL ===== */
    .detail-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideIn 0.4s ease 0.1s both;
    }

    .detail-scroll {
      overflow: auto;
      padding: 16px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .detail-block {
      border: 1px solid var(--border-light);
      border-radius: 14px;
      background: linear-gradient(135deg, #fbfcfe 0%, #f8fafc 100%);
      padding: 16px;
      transition: all 0.2s ease;
    }
    .detail-block:hover {
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    .detail-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .detail-value {
      font-size: 15px;
      font-weight: 800;
      margin-top: 6px;
      word-break: break-word;
      letter-spacing: -0.01em;
    }

    .kv {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px 14px;
      font-size: 13px;
      align-items: center;
    }

    .kv div:nth-child(odd) {
      color: var(--muted);
      font-weight: 500;
    }

    .kv div:nth-child(even) {
      text-align: right;
      font-weight: 700;
    }

    .subtabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .subtabs button {
      border: 1px solid var(--border-light);
      background: white;
      color: var(--muted);
      height: 32px;
      border-radius: 999px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }
    .subtabs button:hover {
      border-color: var(--border);
      box-shadow: var(--shadow);
    }
    .subtabs button.active {
      color: var(--primary);
      background: linear-gradient(135deg, var(--primary-weak) 0%, #dbeafe 100%);
      border-color: rgba(37, 99, 235, 0.2);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.15);
    }

    /* ===== BROWSER FRAME ===== */
    .browser-frame {
      padding: 0;
      overflow: hidden;
    }

    .browser-top {
      height: 40px;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
    }

    .traffic {
      display: flex;
      gap: 7px;
      margin-right: 8px;
    }

    .traffic span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
      transition: transform 0.2s ease;
    }
    .traffic span:hover {
      transform: scale(1.15);
    }

    .traffic .r { background: linear-gradient(135deg, #fb7185, #f43f5e); }
    .traffic .y { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
    .traffic .g { background: linear-gradient(135deg, #34d399, #10b981); }

    .address {
      flex: 1;
      height: 26px;
      border-radius: 999px;
      background: white;
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
    }

    .browser-body {
      height: 380px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.88)),
        linear-gradient(135deg, rgba(37,99,235,0.06), rgba(22,163,74,0.04), rgba(245, 158, 11, 0.03));
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
      padding: 18px;
    }

    .browser-page {
      border: 1px solid var(--border-light);
      border-radius: 16px;
      background: white;
      padding: 16px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.06);
      min-width: 0;
      transition: all 0.3s ease;
    }
    .browser-page:hover {
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.1);
      transform: translateY(-2px);
    }

    .browser-card {
      border: 1px solid var(--border-light);
      border-radius: 14px;
      background: linear-gradient(135deg, #f8fbff 0%, #f0f7ff 100%);
      padding: 14px;
      margin-top: 12px;
      transition: all 0.2s ease;
    }
    .browser-card:hover {
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
    }

    .hero-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .hero-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .hero-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .browser-mini-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .browser-mini {
      border: 1px solid var(--border-light);
      border-radius: 12px;
      background: white;
      height: 90px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
    }
    .browser-mini:hover {
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
      transform: translateY(-2px);
    }

    .browser-mini .bar {
      height: 8px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .browser-mini .bar.fill {
      width: 72%;
      background: linear-gradient(90deg, #60a5fa, #2563eb);
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.2);
      animation: shimmer 3s infinite;
      background-size: 200% 100%;
    }

    .browser-feed {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .feed-item {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      background: white;
      padding: 12px 14px;
      transition: all 0.2s ease;
    }
    .feed-item:hover {
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
      transform: translateX(2px);
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      display: grid;
      place-items: center;
      color: #1d4ed8;
      font-weight: 700;
      font-size: 12px;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.15);
    }

    .feed-title {
      font-size: 13px;
      font-weight: 700;
    }

    .feed-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 500;
    }

    .feed-right {
      text-align: right;
      font-size: 11px;
      color: var(--soft);
      font-weight: 600;
    }

    /* ===== SETTINGS ===== */
    .settings-panel {
      overflow: hidden;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      padding: 20px;
    }

    .field {
      border: 1px solid var(--border-light);
      background: linear-gradient(135deg, var(--panel-2) 0%, #ffffff 100%);
      border-radius: 14px;
      padding: 16px;
      min-width: 0;
      transition: all 0.2s ease;
    }
    .field:hover {
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
    }
    .field:focus-within {
      border-color: rgba(37, 99, 235, 0.3);
      box-shadow: var(--shadow-glow);
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 11px 14px;
      background: white;
      outline: none;
      resize: vertical;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: rgba(37, 99, 235, 0.4);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .field textarea {
      min-height: 100px;
    }

    .field .hint {
      margin-top: 10px;
      font-size: 11px;
      color: var(--soft);
      font-weight: 500;
    }

    .footer-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      padding: 0 20px 20px;
    }

    .empty {
      padding: 32px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      color: var(--text);
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 700;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
    }

    .link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }

    .scroll {
      overflow: auto;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--soft);
    }
  </style>
</head>
<body>

  <script>
    const state = {
      view: 'profiles',
      filters: {
        profiles: 'all',
        sessions: 'all',
        tasks: 'all',
        results: 'all',
      },
      query: '',
      selected: {

    const data = {
      profiles: [
        { id: 'p1', name: 'Alpha Shop', note: '东南亚站点', proxy: 'SOCKS5 34.80.*.*', plugin: '2 enabled', status: 'running', last: '2 min ago', account: 'alpha01', locale: 'en-US', tz: 'UTC+8', url: 'https://example.com/dashboard' },

        { id: 'p4', name: 'Retail Crawl', note: '商品列表', proxy: 'HTTP 52.78.*.*', plugin: '0 enabled', status: 'error', last: '44 min ago', account: 'retail04', locale: 'en-US', tz: 'UTC-5', url: 'https://example.com/store' },
        { id: 'p5', name: 'News Watch', note: '新闻站点', proxy: 'SOCKS5 43.156.*.*', plugin: '1 enabled', status: 'stopped', last: '1 hour ago', account: 'watch05', locale: 'en-GB', tz: 'UTC+1', url: 'https://example.com/news' },
        { id: 'p6', name: 'Forum Miner', note: '论坛抓取', proxy: 'HTTP 8.219.*.*', plugin: '2 enabled', status: 'running', last: '5 min ago', account: 'forum06', locale: 'ja-JP', tz: 'UTC+9', url: 'https://example.com/forum' },
      ],
      sessions: [
        { id: 's1', profile: 'Alpha Shop', site: 'ShopHub', runtime: '18m 22s', status: 'running', mem: '268 MB', cpu: '7%', url: 'https://shophub.example/list', plugins: '2 enabled', activity: 'Fetching page 4/7' },
        { id: 's2', profile: 'TikTok Research', site: 'TikTok', runtime: '41m 05s', status: 'running', mem: '311 MB', cpu: '13%', url: 'https://www.tiktok.com/@demo', plugins: '3 enabled', activity: 'Login session stable' },
        { id: 's3', profile: 'Retail Crawl', site: 'StoreFront', runtime: '0m 00s', status: 'error', mem: '-', cpu: '-', url: 'n/a', plugins: '0 enabled', activity: 'Extension load failed' },
        { id: 's4', profile: 'Forum Miner', site: 'ForumBoard', runtime: '06m 17s', status: 'running', mem: '224 MB', cpu: '6%', url: 'https://forum.example/thread', plugins: '2 enabled', activity: 'Parsing post list' },
      ],
      tasks: [
        { id: 't1', name: 'Seed Account Sync', profile: 'Alpha Shop', site: 'ShopHub', status: 'running', progress: 72, run: '12:08', errors: 0, mode: 'queue' },
        { id: 't2', name: 'Creator Scan', profile: 'Video Lab', site: 'VideoShare', status: 'waiting', progress: 18, run: '12:12', errors: 0, mode: 'single' },
        { id: 't3', name: 'News Watcher', profile: 'News Watch', site: 'NewsDesk', status: 'done', progress: 100, run: '11:42', errors: 0, mode: 'crawl' },
        { id: 't4', name: 'TikTok Template', profile: 'TikTok Research', site: 'TikTok', status: 'running', progress: 61, run: '12:18', errors: 1, mode: 'adapter' },
        { id: 't5', name: 'Forum Index', profile: 'Forum Miner', site: 'ForumBoard', status: 'error', progress: 37, run: '11:55', errors: 3, mode: 'crawl' },
      ],
      results: [
        { id: 'r1', source: 'TikTok Research', site: 'TikTok', task: 'TikTok Template', title: '@demo_creator', time: '12:19', status: 'done', fields: 14, json: { username: 'demo_creator', followers: 113200, videos: 88 } },
        { id: 'r2', source: 'Alpha Shop', site: 'ShopHub', task: 'Seed Account Sync', title: 'Product 0381', time: '12:16', status: 'done', fields: 9, json: { product: 'Product 0381', price: 129, stock: 'In stock' } },
        { id: 'r3', source: 'Forum Miner', site: 'ForumBoard', task: 'Forum Index', title: 'Thread 52', time: '12:06', status: 'done', fields: 11, json: { thread: 'Thread 52', replies: 92, author: 'admin' } },
        { id: 'r4', source: 'Video Lab', site: 'VideoShare', task: 'Creator Scan', title: 'Clip 2042', time: '11:58', status: 'done', fields: 13, json: { clip: 'Clip 2042', views: 98120, likes: 3411 } },
      ],
    };

    const icons = {
      profiles: '◈',
      sessions: '◫',
      tasks: '▤',
      results: '◧',
      settings: '◉',
    };

    const viewMeta = {
      profiles: {
        title: 'Profile 管理',
        desc: '管理多个独立浏览器 Profile、插件、代理与任务入口。',
      },
      sessions: {
        title: '浏览器会话',
        desc: '查看正在运行的 Chromium 会话、资源和当前访问页面。',
      },
      tasks: {
        title: '任务中心',
        desc: '管理采集任务队列、运行状态和失败记录。',
      },
      results: {
        title: '数据结果',
        desc: '查看结构化采集结果、原始 JSON 和导出入口。',
      },
      settings: {
        title: '设置',
        desc: '调整并发、路径、浏览器行为和日志参数。',
      },
    };

    const mainPanel = document.getElementById('mainPanel');
    const detailPanel = document.getElementById('detailPanel');
    const detailTitle = document.getElementById('detailTitle');
    const detailSub = document.getElementById('detailSub');
    const detailStatus = document.getElementById('detailStatus');
    const pageTitle = document.getElementById('pageTitle');
    const pageDesc = document.getElementById('pageDesc');
    const globalSearch = document.getElementById('globalSearch');

    function statusPill(status) {
      const map = {
        running: ['green', '运行中'],
        stopped: ['gray', '已停止'],
        error: ['red', '异常'],
        waiting: ['amber', '等待中'],
        done: ['blue', '已完成'],
      };
      const [klass, label] = map[status] || ['gray', status];
      return `<span class="pill ${klass}"><span class="dot"></span>${label}</span>`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function matchesQuery(item, fields) {
      const q = state.query.trim().toLowerCase();
      if (!q) return true;
      return fields.some((value) => String(value).toLowerCase().includes(q));
    }

    function filterRows(rows, kind) {
      const filter = state.filters[kind] || 'all';
      return rows.filter((row) => {
        if (filter !== 'all' && row.status !== filter) return false;
        return matchesQuery(row, Object.values(row));
      });
    }

    function renderTable(rows, columns, kind) {
      if (!rows.length) {
        return `<div class="empty"><strong>没有匹配结果</strong>试试换一个搜索词或者切换状态筛选。</div>`;
      }
      const heads = columns.map((c) => `<th style="width:${c.width || 'auto'}">${c.label}</th>`).join('');
      const body = rows.map((row) => {
        const selected = state.selected[kind] === row.id ? 'selected' : '';
        const cells = columns.map((c) => {
          if (c.render) return `<td>${c.render(row)}</td>`;
          return `<td title="${escapeHtml(row[c.key])}">${escapeHtml(row[c.key])}</td>`;
        }).join('');
        return `<tr class="${selected}" data-kind="${kind}" data-id="${row.id}">${cells}</tr>`;
      }).join('');
      return `
        <table>
          <thead><tr>${heads}</tr></thead>
          <tbody>${body}</tbody>
        </table>`;
    }

    function renderProfiles() {
      const rows = filterRows(data.profiles, 'profiles');
      return renderTable(rows, [
        { label: '名称', key: 'name', width: '18%' },
        { label: '备注', key: 'note', width: '18%', render: (r) => `<span class="cell-muted">${escapeHtml(r.note)}</span>` },
        { label: '代理', key: 'proxy', width: '18%', render: (r) => escapeHtml(r.proxy) },
        { label: '插件', key: 'plugin', width: '14%', render: (r) => `<span class="pill blue"><span class="dot"></span>${escapeHtml(r.plugin)}</span>` },
        { label: '最近启动', key: 'last', width: '12%' },
        { label: '状态', key: 'status', width: '10%', render: (r) => statusPill(r.status) },
        { label: '操作', key: 'actions', width: '10%', render: (r) => `
          <div class="table-actions">
            <button class="mini-btn primary">启动</button>
            <button class="mini-btn">编辑</button>
          </div>` },
      ], 'profiles');
    }

    function renderSessions() {
      const rows = filterRows(data.sessions, 'sessions');
      return renderTable(rows, [
        { label: 'Profile', key: 'profile', width: '18%' },
        { label: '站点', key: 'site', width: '14%' },
        { label: '运行时长', key: 'runtime', width: '12%' },
        { label: '内存', key: 'mem', width: '10%' },
        { label: 'CPU', key: 'cpu', width: '8%' },

            <div class="detail-label">Raw JSON</div>
            <pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.5;background:#0f172a;color:#e2e8f0;border-radius:14px;padding:14px;margin:10px 0 0;">${escapeHtml(JSON.stringify(selected.json, null, 2))}</pre>
          </div>
          <div class="detail-block">
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="primary-btn" style="height:32px;">Copy JSON</button>
              <button class="ghost-btn" style="height:32px;">Open task</button>
            </div>
          </div>
        `;
      } else {
        detailPanel.innerHTML = `
          <div class="detail-block">
            <div class="detail-label">Setting summary</div>
            <div class="detail-value">Local-first configuration</div>
            <div class="muted" style="font-size:12px;margin-top:6px;">Browser, storage, and plugin paths stay on the machine.</div>
          </div>
          <div class="detail-block">
            <div class="kv">
              <div>Build target</div><div>.app</div>
              <div>Browser mode</div><div>Visible</div>
              <div>Extensions</div><div>CRX + unpacked</div>
              <div>Data store</div><div>SQLite</div>
            </div>
          </div>
          <div class="detail-block">
            <div class="detail-label">Notes</div>
            <div class="muted" style="font-size:12px;margin-top:8px;line-height:1.6;">This prototype is intentionally visual-first so you can confirm layout, density, and interaction patterns before development starts.</div>
          </div>
        `;
      }
    }

    function updateFilterUI() {
      document.querySelectorAll('.seg button').forEach((button) => {
        const context = button.closest('.seg')?.dataset.context;
        if (context !== state.view) return;
        button.classList.toggle('active', button.dataset.filter === state.filters[state.view]);
      });
    }

    document.addEventListener('click', (event) => {
      const nav = event.target.closest('.nav button');
      if (nav) {
        state.view = nav.dataset.view;
        renderMain();
        updateFilterUI();
        return;
      }

      const segButton = event.target.closest('.seg button');
      if (segButton) {
        const context = segButton.closest('.seg')?.dataset.context;
        if (context === state.view) {
          state.filters[state.view] = segButton.dataset.filter;
          renderMain();
          updateFilterUI();
        }
        return;
      }

      const row = event.target.closest('tr[data-kind][data-id]');
      if (row) {
        state.selected[row.dataset.kind] = row.dataset.id;
        renderMain();
        updateFilterUI();
      }
    });

    globalSearch.addEventListener('input', (event) => {
      state.query = event.target.value || '';
      renderMain();
      updateFilterUI();
    });

    renderMain();
    updateFilterUI();
  </script>
</body>
</html>
